<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Configurações - Hotel do Baú</title>

<link
    rel="stylesheet"
    href="css/style.css"
>

<style>

/* =========================================
   BLOQUEIO
========================================= */

#bloqueioAcesso {

    position: fixed;

    inset: 0;

    background: #f4f6f8;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    z-index: 99999;

    font-family: Arial;

    color: #17212b;

}

#bloqueioAcesso strong {

    font-size: 22px;

}

#bloqueioAcesso span {

    margin-top: 10px;

    color: #777;

}

body.liberado #bloqueioAcesso {

    display: none;

}


/* =========================================
   MENU CONFIGURAÇÕES
========================================= */

.menu-configuracoes {

    display: flex;

    flex-direction: column;

    gap: 15px;

    margin-top: 25px;

}

.menu-config-item {

    width: 100%;

    display: flex;

    align-items: center;

    gap: 18px;

    padding: 18px;

    background: white;

    border: none;

    border-radius: 14px;

    box-shadow:
        0 3px 10px rgba(0,0,0,0.08);

    cursor: pointer;

    text-align: left;

}

.menu-config-item span {

    font-size: 32px;

    width: 45px;

    text-align: center;

}

.menu-config-item strong {

    display: block;

    font-size: 17px;

    color: #17212b;

    margin-bottom: 4px;

}

.menu-config-item small {

    color: #777;

    font-size: 13px;

}

.menu-config-item:hover {

    transform: translateY(-2px);

}


/* =========================================
   ÁREA DE USUÁRIOS
========================================= */

#areaUsuarios {

    display: none;

    margin-top: 25px;

}

#areaUsuarios.visivel {

    display: block;

}


/* =========================================
   CABEÇALHO DA ÁREA
========================================= */

.cabecalhoUsuarios {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 18px;

}

.cabecalho
