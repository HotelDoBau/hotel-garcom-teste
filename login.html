<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Acesso - Hotel do Baú</title>


<style>

* {
    box-sizing: border-box;
}


body {

    margin:0;

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:20px;

    background:#f4f6f8;

    font-family:Arial, Helvetica, sans-serif;

}


.login-container {

    width:100%;

    max-width:380px;

    background:white;

    padding:35px 30px;

    border-radius:14px;

    box-shadow:0 8px 25px rgba(0,0,0,0.10);

}


.logo {

    text-align:center;

    margin-bottom:30px;

}


.logo h1 {

    margin:0;

    color:#17212b;

    font-size:28px;

}


.logo p {

    margin:8px 0 0;

    color:#777;

    font-size:14px;

}


.campo {

    margin-bottom:18px;

}


.campo label {

    display:block;

    margin-bottom:7px;

    color:#333;

    font-size:14px;

    font-weight:600;

}


.campo input {

    width:100%;

    padding:13px;

    border:1px solid #d5d9dd;

    border-radius:8px;

    font-size:17px;

    outline:none;

}


.campo input:focus {

    border-color:#17212b;

}


.botao-login {

    width:100%;

    padding:14px;

    border:none;

    border-radius:8px;

    background:#17212b;

    color:white;

    font-size:16px;

    font-weight:600;

    cursor:pointer;

}


.botao-login:hover {

    opacity:0.9;

}


.mensagem {

    margin-top:15px;

    min-height:20px;

    text-align:center;

    color:#c0392b;

    font-size:14px;

}


</style>


</head>


<body>


<div class="login-container">


<div class="logo">

<h1>Hotel do Baú</h1>

<p>Acesso dos garçons</p>

</div>



<form id="formLogin">


<div class="campo">

<label for="usuario">
Usuário
</label>


<input

type="text"

id="usuario"

placeholder="Digite seu usuário"

autocomplete="username"

required

>

</div>



<div class="campo">

<label for="senha">
Senha
</label>


<input

type="password"

id="senha"

placeholder="Digite sua senha"

autocomplete="current-password"

required

>

</div>



<button

type="submit"

class="botao-login"

>

ENTRAR

</button>



<div

id="mensagem"

class="mensagem"

></div>



</form>


</div>



<script type="module">


import {

initializeApp

} from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";



import {

getAuth,

signInWithEmailAndPassword

} from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";



import {

getFirestore,

doc,

getDoc,

collection,

query,

where,

getDocs

} from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";



const firebaseConfig = {


apiKey:
"AIzaSyAEj82ZchuqIEzbG1PhbLclqiSbIEPifWU",


authDomain:
"hotel-garcom-teste.firebaseapp.com",


projectId:
"hotel-garcom-teste",


storageBucket:
"hotel-garcom-teste.firebasestorage.app",


messagingSenderId:
"608879824533",


appId:
"1:608879824533:web:2c6e47be27336607b8559c"


};



const app = initializeApp(firebaseConfig);


const auth = getAuth(app);


const db = getFirestore(app);



const formLogin =
document.getElementById("formLogin");


const mensagem =
document.getElementById("mensagem");



formLogin.addEventListener(

"submit",

async function(evento){


evento.preventDefault();



const usuario =

document.getElementById("usuario")

.value

.trim()

.toLowerCase();



const senha =

document.getElementById("senha")

.value;



mensagem.style.color="#777";

mensagem.textContent="Entrando...";



try {



const email =

usuario + "@hoteldobau.com";



const resultado =

await signInWithEmailAndPassword(

auth,

email,

senha

);



const usuarioFirebase =

resultado.user;

// ===========================
// VERIFICA ADMINISTRADOR
// ===========================


const adminRef = doc(
    db,
    "administradores",
    usuarioFirebase.uid
);


const adminSnap = await getDoc(adminRef);



if(adminSnap.exists()) {


    const dadosAdmin =
        adminSnap.data();


    if(dadosAdmin.ativo === true) {


        localStorage.setItem(
            "usuarioLogado",
            JSON.stringify({

                uid:
                    usuarioFirebase.uid,

                nome:
                    dadosAdmin.nome,

                tipo:
                    "administrador"

            })
        );


        console.log(
            "Administrador:",
            dadosAdmin.nome
        );


        window.location.replace(
            "./index.html"
        );


        return;

    }

}

const referencia =

collection(

db,

"garcons"

);



const consulta =

query(

referencia,

where(

"uid",

"==",

usuarioFirebase.uid

)

);



const resultadoGarcom =

await getDocs(consulta);



if(resultadoGarcom.empty){


mensagem.style.color="#c0392b";

mensagem.textContent=

"Garçom não cadastrado.";

return;


}



const dados =

resultadoGarcom.docs[0].data();



if(dados.ativo !== true){


mensagem.style.color="#c0392b";

mensagem.textContent=

"Usuário desativado.";

return;


}



localStorage.setItem(

"garcomLogado",

JSON.stringify({

uid:

usuarioFirebase.uid,


nome:

dados.nome,


usuario:

dados.usuario

})

);



window.location.replace(

"./index.html"

);



}

catch(erro){


console.error(erro);


mensagem.style.color="#c0392b";


mensagem.textContent=

"Erro: " + erro.code;


}



}

);



</script>


</body>

</html>
