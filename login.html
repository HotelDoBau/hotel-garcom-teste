<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Acesso Administrativo - Hotel do Baú</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

            background: #f4f6f8;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

        }

        .login-container {

            width: 100%;

            max-width: 400px;

            background: white;

            padding: 35px 30px;

            border-radius: 14px;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.10);

        }

        .logo {

            text-align: center;

            margin-bottom: 30px;

        }

        .logo h1 {

            margin: 0;

            color: #17212b;

            font-size: 28px;

        }

        .logo p {

            margin: 8px 0 0;

            color: #777;

            font-size: 14px;

        }

        .campo {

            margin-bottom: 18px;

        }

        .campo label {

            display: block;

            margin-bottom: 7px;

            color: #333;

            font-size: 14px;

            font-weight: 600;

        }

        .campo input {

            width: 100%;

            padding: 13px;

            border: 1px solid #d5d9dd;

            border-radius: 8px;

            font-size: 16px;

            outline: none;

        }

        .campo input:focus {

            border-color: #17212b;

        }

        .botao-login {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #17212b;

            color: white;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;

        }

        .botao-login:hover {

            opacity: 0.9;

        }

        .mensagem {

            margin-top: 15px;

            min-height: 20px;

            text-align: center;

            color: #c0392b;

            font-size: 14px;

        }

    </style>

</head>

<body>

    <div class="login-container">

        <div class="logo">

            <h1>Hotel do Baú</h1>

            <p>Acesso administrativo</p>

        </div>


        <form id="formLogin">

            <div class="campo">

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Digite seu e-mail"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="campo">

                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="botao-login"
            >
                Entrar
            </button>

            <div
                id="mensagem"
                class="mensagem"
            ></div>

        </form>

    </div>


    <script type="module">

        import {
            getAuth,
            signInWithEmailAndPassword
        } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";


        const firebaseConfig = {

            apiKey:
                "AIzaSyAEj82ZchuqIEzbG1PhbLclqiSbIEPifWU",

            authDomain:
                "hotel-garcom-teste.firebaseapp.com",

            projectId:
                "hotel-garcom-teste",

            storageBucket:
                "hotel-garcom-teste.firebasestorage.app",

            messagingSenderId:
                "608879824533",

            appId:
                "1:608879824533:web:2c6e47be27336607b8559c"

        };


        const app =
            initializeApp(firebaseConfig);

        const auth =
            getAuth(app);


        const formLogin =
            document.getElementById("formLogin");

        const mensagem =
            document.getElementById("mensagem");


        formLogin.addEventListener(
            "submit",
            async function (evento) {

                evento.preventDefault();


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();

                const senha =
                    document
                        .getElementById("senha")
                        .value;


                mensagem.textContent =
                    "Entrando...";


                try {

                    await signInWithEmailAndPassword(
                        auth,
                        email,
                        senha
                    );


                    mensagem.style.color =
                        "#16803c";

                    mensagem.textContent =
                        "Login realizado com sucesso.";


                    setTimeout(function () {

                        window.location.href =
                            "index.html";

                    }, 500);


                } catch (erro) {

                    console.error(erro);

                    mensagem.style.color =
                        "#c0392b";

                    mensagem.textContent =
                        "E-mail ou senha incorretos.";

                }

            }
        );

    </script>

</body>

</html>
